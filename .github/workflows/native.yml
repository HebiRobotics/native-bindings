name: native

# Builds the GraalVM shared library and runs the C, C++, Python and MATLAB suites
# against it on all three platforms. Much slower than verify.yml, which is why the
# reference file gate lives in its own workflow.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_amd64
            lib_file: libbindings_tests.so
            mex_ext: mexa64
          - os: windows-latest
            platform: win_amd64
            lib_file: bindings_tests.dll
            mex_ext: mexw64
          - os: macos-latest
            platform: osx_arm64
            lib_file: libbindings_tests.dylib
            mex_ext: mexmaca64

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    env:
      MODULE_DIR: bindings-tests
      BINDINGS_DIR: bindings-tests/target/image/static/bindings

    # bash everywhere, so the same commands work on the Windows runner
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # native-image needs the MSVC toolchain on PATH
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Stage one. native-image runs through the generated target/image/static/compiler-<os>,
      # which also emits the static library and the cmake fragments into target/image/static.
      - name: Build the shared library and the bindings
        run: mvn -B clean verify -Pnative

      # Compiling MEX does not need a MATLAB install, only the headers and the static
      # import libs. This minimal SDK holds exactly those files.
      - name: Download the MEX SDK
        run: |
          curl -sSL "https://files.hebi.us/internal/mex-sdk/R2018b.zip" -o mex_sdk.zip
          unzip -q mex_sdk.zip -d mex_sdk
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "MATLABROOT=$(pwd -W)/mex_sdk" >> $GITHUB_ENV
          else
            echo "MATLABROOT=$(pwd)/mex_sdk" >> $GITHUB_ENV
          fi

      # Stage two. Links the static library into the final shared library and, with
      # MATLABROOT set above, builds the MEX gateway.
      # Note: the release CI uses -G "Visual Studio 17 2022" -T v142 on Windows to stay
      # compatible with MATLAB before R2022a. The default generator is fine for the suites.
      - name: Link the release library with CMake
        run: |
          cmake -S $MODULE_DIR/target/image/static -B $MODULE_DIR/target/native-build
          cmake --build $MODULE_DIR/target/native-build --config Release

      # The Python and MATLAB wrappers look for the library under
      # <bindings>/lib/<platform>/, so put a copy where they expect it.
      - name: Stage the shared library for the wrappers
        run: |
          RELEASE_LIB_DIR="$MODULE_DIR/target/native-build/release/bindings_tests/bindings_tests/lib/${{ matrix.platform }}"
          mkdir -p "$BINDINGS_DIR/lib/${{ matrix.platform }}"
          cp "$RELEASE_LIB_DIR/${{ matrix.lib_file }}" \
             "$BINDINGS_DIR/lib/${{ matrix.platform }}/${{ matrix.lib_file }}"

          # Only present when MATLABROOT was set for the cmake run above
          MEX_FILE="bindings_tests_native.${{ matrix.mex_ext }}"
          if [ -f "$RELEASE_LIB_DIR/$MEX_FILE" ]; then
            cp "$RELEASE_LIB_DIR/$MEX_FILE" "$BINDINGS_DIR/+bindings_tests/private/$MEX_FILE"
          else
            echo "No MEX gateway was built. The MATLAB suite falls back to build_native.m."
          fi

      # ---- C and C++ ----

      - name: Run the C suite
        run: |
          cmake -S $MODULE_DIR/src/test/c -B $MODULE_DIR/target/ctest-c
          cmake --build $MODULE_DIR/target/ctest-c --config Release
          ctest --test-dir $MODULE_DIR/target/ctest-c --build-config Release --output-on-failure

      - name: Run the C++ suite
        run: |
          cmake -S $MODULE_DIR/src/test/cpp -B $MODULE_DIR/target/ctest-cpp
          cmake --build $MODULE_DIR/target/ctest-cpp --config Release
          ctest --test-dir $MODULE_DIR/target/ctest-cpp --build-config Release --output-on-failure

      # ---- Python ----

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the Python suite
        working-directory: bindings-tests
        run: |
          python -m pip install --upgrade pip numpy
          python -m unittest discover -s src/test/python -v

      # ---- MATLAB ----
      # Not available on every runner, so a missing license does not fail the job.
      # MATLAB has no arm64 Linux runner image, but macos-latest is supported.

      - name: Set up MATLAB
        id: setup-matlab
        continue-on-error: true
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b

      # setup-matlab only installs MATLAB. The license checkout happens on first
      # launch, and hosted runners are only licensed for public repos, so probe with
      # a no-op command before gating the real suite on it.
      - name: Check for a MATLAB license
        id: matlab-license
        if: steps.setup-matlab.outcome == 'success'
        continue-on-error: true
        uses: matlab-actions/run-command@v2
        with:
          command: disp(version)

      - name: Run the MATLAB suite
        if: steps.matlab-license.outcome == 'success'
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: bindings-tests/src/test/matlab
          select-by-folder: bindings-tests/src/test/matlab

      - name: Report a skipped MATLAB run
        if: steps.matlab-license.outcome != 'success'
        run: echo "MATLAB is not licensed or not available on this runner, so the MATLAB suite was skipped."

      - name: Upload the generated bindings on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.platform }}
          path: bindings-tests/target/image/static
